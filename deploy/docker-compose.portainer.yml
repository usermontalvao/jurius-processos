  jurius-processos:
    image: python:3.12-slim
    container_name: jurius-processos
    restart: unless-stopped
    network_mode: host
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JURIUS_TOKEN_API: ${JURIUS_TOKEN_API}
