    volumes:
      - jurius_processos_dados:/dados
    working_dir: /app
    command:
      - bash
      - -c
      - |
        set -e
        mkdir -p /app /dados
        echo "$$FONTES_B64" | tr -d ' \n' | base64 -d | tar -xz -C /app
        pip install --no-cache-dir --quiet httpx fastapi uvicorn
        if (exec 3<>/dev/tcp/127.0.0.1/8792) 2>/dev/null; then
          echo "A porta 8792 já está em uso neste servidor. Pare o outro serviço ou troque a porta." >&2
          exit 1
        fi
        exec uvicorn jurius_processos.api:app --host 127.0.0.1 --port 8792
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8792/saude')"]
      interval: 60s
      timeout: 10s
      start_period: 120s

