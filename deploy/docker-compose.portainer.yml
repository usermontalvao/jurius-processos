      JURIUS_ALIMENTAR_IA: "1"
      JURIUS_ALIMENTAR_FICHA: "1"
      JURIUS_CADASTRAR_AUTO: "0"
      JURIUS_VERSAO: "7479172"
      JURIUS_BANCO: /dados/cerebro.sqlite3
      DJEN_INICIO: "2023-01-01"
      TZ: America/Cuiaba
